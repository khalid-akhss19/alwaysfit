name: Build and Deploy to Hostinger
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Hostinger secrets
        run: |
          test -n "${{ secrets.HOSTINGER_SERVER }}"
          test -n "${{ secrets.HOSTINGER_USERNAME }}"
          test -n "${{ secrets.HOSTINGER_PASSWORD }}"
          test -n "${{ secrets.HOSTINGER_SERVER_DIR }}"

      - name: Build
        run: npm run build

      - name: Deploy via FTPS to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_SERVER }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR }}/
          local-dir: './dist/'
          protocol: ftps
          port: 21
          timeout: 600000
